name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Feature queue dispatches CI on Copilot branches so runs skip approval.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run verify
      - run: npm run build
